# Cloudflare Pages configuration for Meta Social Manager
# Production deploy is via Cloudflare Pages Git integration (not `wrangler deploy` as a Worker).
# Local preview: npm run pages:dev
#
# Runtime env for Pages Functions (Create Boost gate).
# Git deploys without these vars clear dashboard env and re-lock Boost.

name = "meta-social-manager"
compatibility_date = "2026-08-11"
pages_build_output_dir = "client/dist"

[vars]
META_APP_MODE = "live"
META_PRIVACY_POLICY_CONFIGURED = "true"
